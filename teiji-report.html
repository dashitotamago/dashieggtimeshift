<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>定時報告作成</title>
<style>
  :root {
    --bg: #F6F3EC; --ink: #22282F; --border: #DED7C6;
    --green: #2F6F4E; --orange: #B5541E; --rose: #C1666B; --blue: #3A6EA5;
    --muted: #7A756A; --muted2: #9A968C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
  .disp { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; }
  header { background: var(--ink); padding: 20px; }
  header h1 { margin: 0; color: #F6F3EC; font-size: 20px; text-align: center; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 16px; }
  input[type=text], input[type=number], input[type=password], input[type=date] {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 15px;
  }
  textarea { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 14px; font-family: inherit; }
  .field-label { font-size: 12px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .field-row:first-child { margin-top: 0; }
  .submit-btn { width: 100%; padding: 14px; margin-top: 12px; background: var(--green); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .save-btn { background: var(--ink); color: #fff; border: none; border-radius: 6px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .add-btn { background: var(--orange); color: #fff; border: none; border-radius: 4px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .remove-btn { background: none; border: 1px solid var(--rose); color: var(--rose); border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .checkpoint-tabs { display: flex; gap: 8px; margin-top: 10px; }
  .checkpoint-btn { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--muted); font-size: 14px; font-weight: 700; cursor: pointer; }
  .checkpoint-btn.active { background: var(--green); border-color: var(--green); color: #fff; }
  .summary-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  .summary-item { flex: 1; min-width: 120px; }
  .summary-item .label { font-size: 11px; color: var(--muted); }
  .summary-item .value { font-size: 20px; font-weight: 700; }
  .adj-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .adj-row input { flex: 1; min-width: 80px; }
  .note { font-size: 12px; color: var(--muted2); margin-top: 8px; }
  .center-msg { text-align: center; padding: 80px 24px; color: var(--muted); }
  .report-text { white-space: pre-wrap; font-size: 15px; line-height: 1.6; background: #FBF8F2; border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzOSPmWXfZTvMLiOa8bucfhU3UgJdUqxucc7NWDCq2WMRHsjHqPFRDm34F8S3og8i_b/exec",
  ADMIN_PASSWORD: "0310",
};
const DEFAULT_WEEKDAY_SLOTS = [{ id: "w1", label: "ワンオペ", start: "09:00", end: "18:00" }];
const DEFAULT_HOLIDAY_SLOTS = [
  { id: "s1", label: "10:00〜15:00", start: "10:00", end: "15:00" },
  { id: "s2", label: "11:30〜16:30", start: "11:30", end: "16:30" },
];
const DEFAULT_HOLIDAY_END_SLOTS = [
  { id: "h1", label: "10:00〜15:00", start: "10:00", end: "15:00" },
  { id: "h2", label: "11:30〜16:30", start: "11:30", end: "16:30" },
];
const CHECKPOINTS = [
  { id: "13", label: "13時" },
  { id: "15", label: "15時" },
  { id: "close", label: "クローズ" },
];

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function hmToMinutes(hm) { const [h, m] = String(hm).split(":").map(Number); return (h || 0) * 60 + (m || 0); }
function fmtYen(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }
function fmtNum(n) { return Math.round(n).toLocaleString("ja-JP"); }

// ---- 日本の祝日を自動計算 ----
const _holidayCache = {};
function nthMonday(year, month, n) {
  const d = new Date(year, month - 1, 1);
  let count = 0;
  while (true) {
    if (d.getDay() === 1) { count++; if (count === n) return new Date(d); }
    d.setDate(d.getDate() + 1);
  }
}
function vernalEquinox(year) { return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)); }
function autumnalEquinox(year) { return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)); }
function getJapanHolidays(year) {
  if (_holidayCache[year]) return _holidayCache[year];
  const list = [];
  const add = (m, d, name) => list.push({ date: new Date(year, m - 1, d), name });
  add(1, 1, "元日");
  list.push({ date: nthMonday(year, 1, 2), name: "成人の日" });
  add(2, 11, "建国記念の日");
  add(2, 23, "天皇誕生日");
  add(3, vernalEquinox(year), "春分の日");
  add(4, 29, "昭和の日");
  add(5, 3, "憲法記念日");
  add(5, 4, "みどりの日");
  add(5, 5, "こどもの日");
  list.push({ date: nthMonday(year, 7, 3), name: "海の日" });
  add(8, 11, "山の日");
  list.push({ date: nthMonday(year, 9, 3), name: "敬老の日" });
  add(9, autumnalEquinox(year), "秋分の日");
  list.push({ date: nthMonday(year, 10, 2), name: "スポーツの日" });
  add(11, 3, "文化の日");
  add(11, 23, "勤労感謝の日");
  const byKey = {};
  for (const h of list) byKey[dateKey(h.date)] = h.name;
  for (const h of [...list]) {
    if (h.date.getDay() === 0) {
      let sub = new Date(h.date);
      do { sub.setDate(sub.getDate() + 1); } while (byKey[dateKey(sub)]);
      byKey[dateKey(sub)] = "振替休日";
    }
  }
  const sortedKeys = Object.keys(byKey).sort();
  for (const k of sortedKeys) {
    const d = new Date(k + "T00:00:00");
    const next = new Date(d); next.setDate(next.getDate() + 2);
    const between = new Date(d); between.setDate(between.getDate() + 1);
    if (between.getDay() !== 0 && !byKey[dateKey(between)] && byKey[dateKey(next)]) byKey[dateKey(between)] = "国民の休日";
  }
  _holidayCache[year] = byKey;
  return byKey;
}
function isPublicHoliday(d) { return !!getJapanHolidays(d.getFullYear())[dateKey(d)]; }

function pickSlots(category, snapshot, liveCfg) {
  const legacyKey = category === "holiday" ? "saturday" : category === "holidayEnd" ? "sundayHoliday" : null;
  if (snapshot) {
    if (snapshot[category] && snapshot[category].length) return snapshot[category];
    if (legacyKey && snapshot[legacyKey] && snapshot[legacyKey].length) return snapshot[legacyKey];
    if (category !== "weekday" && snapshot.weekend && snapshot.weekend.length) return snapshot.weekend;
  }
  if (liveCfg) {
    if (liveCfg[category] && liveCfg[category].length) return liveCfg[category];
    if (legacyKey && liveCfg[legacyKey] && liveCfg[legacyKey].length) return liveCfg[legacyKey];
    if (category !== "weekday" && liveCfg.weekend && liveCfg.weekend.length) return liveCfg.weekend;
  }
  if (category === "weekday") return DEFAULT_WEEKDAY_SLOTS;
  if (category === "holiday") return DEFAULT_HOLIDAY_SLOTS;
  return DEFAULT_HOLIDAY_END_SLOTS;
}

// ---- 月ごとのシフト時間設定 ----
// 優先順位: その月の設定(slotsConfig:YYYY-MM) → 確定時に固定された時間 → 前の月の設定(さかのぼる) → 旧・共通設定 → 初期値
let _allCfgCache = null;
async function resolveSlotsFor(mKey, cfgM, monthlyMap) {
  const own = monthlyMap && monthlyMap["slotsConfig:" + mKey];
  if (own) return own;
  if (cfgM && cfgM.slotsSnapshot) return cfgM.slotsSnapshot;
  let [y, m] = mKey.split("-").map(Number);
  for (let i = 0; i < 24; i++) {
    m--; if (m === 0) { m = 12; y--; }
    const k = `${y}-${String(m).padStart(2, "0")}`;
    if (monthlyMap && monthlyMap["slotsConfig:" + k]) return monthlyMap["slotsConfig:" + k];
    if (!_allCfgCache) _allCfgCache = apiListValues("config:");
    const all = await _allCfgCache;
    const c = all["config:" + k];
    if (c && c.slotsSnapshot) return c.slotsSnapshot;
  }
  return null;
}
function wageForMonth(s, mKey) {
  if (!s.wageHistory || !s.wageHistory.length) return s.wage;
  const applicable = s.wageHistory.filter((h) => h.from <= mKey).sort((a, b) => a.from.localeCompare(b.from));
  return applicable.length ? applicable[applicable.length - 1].wage : s.wage;
}
function normalizeStaffDirectory(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map((item) =>
    typeof item === "string"
      ? { name: item, wage: 0, wageHistory: [] }
      : { name: item.name, wage: Number(item.wage) || 0, wageHistory: Array.isArray(item.wageHistory) ? item.wageHistory : [] }
  );
}

async function apiGet(key) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data || data.value == null || data.value === "") return null;
    return JSON.parse(data.value);
  } catch (e) { console.error("apiGet failed", key, e); return null; }
}
async function apiListValues(prefix) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=listValues&prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    const out = {};
    for (const item of (data && data.items) || []) {
      if (item.value == null || item.value === "") continue;
      try { out[item.key] = JSON.parse(item.value); } catch (e) {}
    }
    return out;
  } catch (e) { console.error("apiListValues failed", prefix, e); return {}; }
}
async function apiSet(key, value) {
  try {
    await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "set", key, value: JSON.stringify(value) }) });
    return true;
  } catch (e) { console.error("apiSet failed", key, e); return false; }
}
async function apiAction(payload) {
  try {
    const res = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    return await res.json();
  } catch (e) { console.error("apiAction failed", payload, e); return { error: String(e) }; }
}

const state = {
  flash: "",
  loading: true,
  saving: false,
  targetDate: dateKey(new Date()),
  checkpoint: "13",
  staffDirectory: [],
  confirmed: {},
  weekdaySlots: DEFAULT_WEEKDAY_SLOTS,
  holidaySlots: DEFAULT_HOLIDAY_SLOTS,
  holidayEndSlots: DEFAULT_HOLIDAY_END_SLOTS,
  holidays: [],
  dateOverrides: {},
  slotsSnapshot: null,
  avgWage: 1200,
  monthBudget: 0,
  confirmedMonth: {},
  reportDirty: true,
  report: { sales: "", overCount: "0", callOutCount: "0", missingItems: "", staffHours: [] },
  priorStaffHours: [],
  nextMonthHolidays: [],
};
let loadSeq = 0, cpSeq = 0;
function fmtH(h) { return String(Math.round((Number(h) || 0) * 100) / 100); }
function round2(h) { return Math.round((Number(h) || 0) * 100) / 100; }

function isAutoNonWorking(d) { const dow = d.getDay(); return dow === 0 || dow === 6 || isPublicHoliday(d); }
function isNonWorkingDay(d) { return isAutoNonWorking(d) || state.holidays.includes(dateKey(d)); }
function isWeekendType(d) { return isNonWorkingDay(d); }
function dayCategory(d) {
  if (!isNonWorkingDay(d)) return "weekday";
  const next = new Date(d);
  next.setDate(next.getDate() + 1);
  const nk = dateKey(next);
  const nextNonWorking = isAutoNonWorking(next) || state.holidays.includes(nk) || (state.nextMonthHolidays || []).includes(nk);
  return nextNonWorking ? "holiday" : "holidayEnd";
}
function slotsForDate(d) {
  const override = state.dateOverrides[dateKey(d)];
  if (override && override.length) return override;
  const cat = dayCategory(d);
  if (cat === "holiday") return state.holidaySlots;
  if (cat === "holidayEnd") return state.holidayEndSlots;
  return state.weekdaySlots;
}
function wageOf(name) {
  // この報告は概算値のため、個々のスタッフの実際の時給ではなく、
  // 設定された「平均時給」をそのまま一律で使う。
  return state.avgWage;
}


// ---- 月予算 → 日ごとの予算(自動配分) ----
// 1人の日を1、2人以上が同時に入る日を1.5として月予算を按分する。確定シフトが未登録の日は、枠の想定人数で判定する。
function dayBudgetWeight(slots, dayConf) {
  if (!slots || !slots.length) return 0;
  const hasConf = Object.values(dayConf || {}).some(Boolean);
  const items = [];
  for (const s of slots) {
    const name = hasConf ? (dayConf || {})[s.id] : "slot:" + s.id;
    if (!name) continue;
    const st = hmToMinutes(s.start), en = hmToMinutes(s.end);
    if (en > st) items.push({ name, st, en });
  }
  if (!items.length) return 0;
  for (let i = 0; i < items.length; i++) {
    for (let j = i + 1; j < items.length; j++) {
      if (items[i].name !== items[j].name && Math.min(items[i].en, items[j].en) > Math.max(items[i].st, items[j].st)) return 1.5;
    }
  }
  return 1;
}
function dayPlannedHours(slots, dayConf) {
  // その日の予定労働時間(確定シフトの合計。確定前の日は枠の合計)
  const hasConf = Object.values(dayConf || {}).some(Boolean);
  let h = 0;
  for (const s of slots || []) {
    if (hasConf && !(dayConf || {})[s.id]) continue;
    h += Math.max(0, hmToMinutes(s.end) - hmToMinutes(s.start)) / 60;
  }
  return round2(h);
}
// 月予算 → 予算単価(円/時) → 日予算。
//  日予算 = 労働時間 × 予算単価。予算単価は、1人の日を r、2人以上が同時に入る日を r×1.5 として、
//  月の「労働時間×係数(1または1.5)」の合計で月予算を割って決める(月予算 ＝ 各日の労働時間×その日の単価の合計)。
function monthBudgetInfo() {
  const [y, m] = state.targetDate.split("-").map(Number);
  let sum = 0, wT = 0, hT = 0;
  const d = new Date(y, m - 1, 1);
  while (d.getMonth() === m - 1) {
    const k = dateKey(d);
    const slots = slotsForDate(d);
    const dayConf = (state.confirmedMonth || {})[k] || {};
    const w = dayBudgetWeight(slots, dayConf);
    const h = dayPlannedHours(slots, dayConf);
    sum += w * h;
    if (k === state.targetDate) { wT = w; hT = h; }
    d.setDate(d.getDate() + 1);
  }
  const mb = Number(state.monthBudget) || 0;
  const base = mb > 0 && sum > 0 ? mb / sum : 0;
  return { weight: wT, hours: hT, sum, baseRate: base, rate: base * wT };
}
// 日予算の計算に使う「労働時間」と「予算単価」(定時報告の内容を反映)
//  ・労働時間 ＝ その日の予定労働時間 ＋ (報告の人数・時間の修正による増減)
//  ・単価 ＝ 2人の日でも、報告上の人数が2人未満(減った/0hの人がいる)なら1人の単価を使う
function budgetCalc() {
  const g = monthBudgetInfo();
  let hours = g.hours + (cumulativeHoursTotal() - calculatedLaborHours());
  if (!(hours > 0)) hours = 0;
  hours = round2(hours);
  const present = cumulativeStaffList().length; // 時間が0より大きいスタッフの人数
  let mult = g.weight === 1.5 ? (present >= 2 ? 1.5 : 1) : (g.weight === 1 ? 1 : (present >= 2 ? 1.5 : present === 1 ? 1 : 0));
  const rate = g.baseRate * mult;
  return { hours, rate, mult, planned: g.hours, weight: g.weight, baseRate: g.baseRate };
}
function effectiveBudget() {
  const c = budgetCalc();
  return Math.round(c.hours * c.rate);
}
// 売上単価(円/時) = 売上 ÷ 実際の労働時間(一覧の合計)。予算単価以上なら予算達成。
function unitInfo() {
  const g = budgetCalc();
  const budget = effectiveBudget();
  const hours = totalLaborHours();
  const sales = Number(state.report.sales) || 0;
  const salesUnit = hours > 0 ? sales / hours : 0;
  return { budget, planned: g.planned, budgetUnit: g.rate, hours, sales, salesUnit, ok: g.rate > 0 && salesUnit >= g.rate };
}
async function saveMonthBudget(value) {
  state.monthBudget = Number(value) || 0;
  await apiSet(`monthBudget:${state.targetDate.slice(0, 7)}`, state.monthBudget);
  render();
  flash("月予算を保存しました");
}

function flash(msg, bad) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.cssText = `position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:${bad ? "#B03A3A" : "#2F6F4E"};color:#fff;padding:12px 18px;border-radius:8px;font-weight:700;font-size:14px;z-index:99;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.25)`;
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, bad ? 6000 : 1800);
}

// ---- 読み込み(まとめて1回・前回の表示を即表示してから裏で最新に更新) ----
async function apiBatch(keys, prefixes) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=getMany&keys=${encodeURIComponent(JSON.stringify(keys))}&prefixes=${encodeURIComponent(JSON.stringify(prefixes))}`);
    const data = await res.json();
    if (data && !data.error && data.values) {
      const values = {}, lists = {};
      for (const k in data.values) { try { values[k] = JSON.parse(data.values[k]); } catch (e) {} }
      for (const pf in data.lists || {}) {
        lists[pf] = {};
        for (const it of data.lists[pf]) { try { lists[pf][it.key] = JSON.parse(it.value); } catch (e) {} }
      }
      return { values, lists };
    }
  } catch (e) { console.error("getMany failed, fallback", e); }
  // Code.gs が未更新の場合の代替(並列で個別取得)
  const values = {}, lists = {};
  await Promise.all([
    ...keys.map(async (k) => { const v = await apiGet(k); if (v != null) values[k] = v; }),
    ...prefixes.map(async (pf) => { lists[pf] = await apiListValues(pf); }),
  ]);
  return { values, lists };
}
function cacheKey(date) { return "teijiBatch:" + date; }
function readCache(date) { try { const t = localStorage.getItem(cacheKey(date)); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function writeCache(date, b) { try { localStorage.setItem(cacheKey(date), JSON.stringify(b)); } catch (e) {} }

async function applyBatch(b, keepReport) {
  const date = state.targetDate;
  const mKey = date.slice(0, 7);
  const nd = new Date(date + "T00:00:00"); nd.setDate(nd.getDate() + 1);
  const nextMKey = monthKey(nd);
  const v = b.values || {}, l = b.lists || {};
  const cfgAll = l["config:"] || {};
  const cfg = cfgAll["config:" + mKey] || null;
  const nextCfg = nextMKey !== mKey ? (cfgAll["config:" + nextMKey] || null) : null;
  _allCfgCache = Promise.resolve(cfgAll);
  state.staffDirectory = normalizeStaffDirectory(v.staffList);
  state.holidays = (cfg && cfg.holidays) || [];
  state.dateOverrides = (cfg && cfg.dateOverrides) || {};
  state.nextMonthHolidays = (nextCfg && nextCfg.holidays) || [];
  const slotsCfg = v.slotsConfig || null;
  state.slotsSnapshot = await resolveSlotsFor(mKey, cfg, l["slotsConfig:"] || {});
  if (date !== state.targetDate) return;
  state.weekdaySlots = pickSlots("weekday", state.slotsSnapshot, slotsCfg);
  state.holidaySlots = pickSlots("holiday", state.slotsSnapshot, slotsCfg);
  state.holidayEndSlots = pickSlots("holidayEnd", state.slotsSnapshot, slotsCfg);
  state.confirmedMonth = v["confirmed:" + mKey] || {};
  state.confirmed = state.confirmedMonth[date] || {};
  state.avgWage = v.avgWageForReport != null ? v.avgWageForReport : 1200;
  state.monthBudget = Number(v["monthBudget:" + mKey]) || 0;
  state.dayReports = { "13": v[`teijiReport:${date}:13`] || null, "15": v[`teijiReport:${date}:15`] || null, close: v[`teijiReport:${date}:close`] || null };
  if (!keepReport) {
    if (!state.cpChosen) state.checkpoint = defaultCheckpoint();
    buildReport();
  }
  state.loading = false;
  render();
}
function defaultCheckpoint() {
  const d = new Date(state.targetDate + "T00:00:00");
  const r = state.dayReports || {};
  if (!r["13"]) return "13";
  if (!isNonWorkingDay(d)) return "close";
  return r["15"] ? "close" : "15";
}

async function loadDayData() {
  const seq = ++loadSeq;
  const date = state.targetDate;
  const mKey = date.slice(0, 7);
  state.touched = false;
  state.cpChosen = false;
  const cached = readCache(date);
  if (cached) { await applyBatch(cached, false); } else { state.loading = true; render(); }
  const keys = ["staffList", "slotsConfig", "avgWageForReport", `confirmed:${mKey}`, `monthBudget:${mKey}`, `teijiReport:${date}:13`, `teijiReport:${date}:15`, `teijiReport:${date}:close`];
  const fresh = await apiBatch(keys, ["slotsConfig:", "config:"]);
  if (seq !== loadSeq || date !== state.targetDate) return; // 日付を素早く切り替えた場合の古い読み込みは捨てる
  writeCache(date, fresh);
  // 入力を始めている場合は、入力中の報告を守って、シフトなどの最新データだけ反映する
  await applyBatch(fresh, state.touched);
}

function previousCheckpointId(cp) {
  if (cp === "15") return "13";
  if (cp === "close") return "15";
  return null;
}
function blankReport() {
  return { sales: "", overCount: "0", callOutCount: "0", missingItems: "", staffHours: [], shiftBaseline: [] };
}
function sameHours(a, b) {
  const norm = (l) => { const m = {}; (l || []).forEach((r) => { const h = round2(r.hours); if (r.name && h) m[r.name] = (m[r.name] || 0) + h; }); return m; };
  const x = norm(a), y = norm(b);
  const kx = Object.keys(x), ky = Object.keys(y);
  return kx.length === ky.length && kx.every((k) => Math.abs((y[k] || 0) - x[k]) < 0.005);
}
function buildReport() {
  state.priorStaffHours = [];
  const reports = state.dayReports || {};
  const savedReport = reports[state.checkpoint];
  state.shiftNotice = "";
  const fresh = staffHoursBreakdown().map((s) => ({ ...s }));
  if (savedReport) {
    state.report = { ...blankReport(), ...savedReport, staffHours: savedReport.staffHours || [] };
    state.reportDirty = false;
    // 保存後にシフトが変わった場合: 手動修正していなければ自動で最新のシフトに更新する
    const base = savedReport.shiftBaseline;
    if (Array.isArray(base) && sameHours(savedReport.staffHours, base) && !sameHours(base, fresh)) {
      state.report.staffHours = fresh.map((s) => ({ ...s }));
      state.report.shiftBaseline = fresh.map((s) => ({ ...s }));
      state.reportDirty = true;
      state.shiftNotice = "保存後にシフトが変更されていたため、最新のシフトの労働時間に更新しました。内容を確認して「この内容を保存」を押してください。";
    }
  } else {
    const prevId = previousCheckpointId(state.checkpoint);
    const prevReport = prevId ? reports[prevId] : null;
    if (prevReport) {
      state.report = {
        sales: prevReport.sales || "",
        overCount: prevReport.overCount || "0",
        callOutCount: prevReport.callOutCount || "0",
        missingItems: prevReport.missingItems || "",
        staffHours: fresh.map((s) => ({ ...s })),
        shiftBaseline: fresh.map((s) => ({ ...s })),
      };
    } else {
      state.report = { ...blankReport(), staffHours: fresh.map((s) => ({ ...s })), shiftBaseline: fresh.map((s) => ({ ...s })) };
    }
    state.reportDirty = true;
  }
}

function changeDate(v) { state.targetDate = v; loadDayData(); }
function changeCheckpoint(cp) {

  render();

function checkpointMinutes() {
  if (state.checkpoint === "13") return 13 * 60;
  if (state.checkpoint === "15") return 15 * 60;
  return Infinity; // close: full day
}
function isWeekendHolidayForCheckpoints(d) {
  return isNonWorkingDay(d); // 土日祝＋管理画面で休日にした日(シフトの枠の判定と同じ基準)
}
function checkpointRange(cpId, d) {
  if (cpId === "13") return [0, 13 * 60];
  if (cpId === "15") return [13 * 60, 15 * 60];
  return [isWeekendHolidayForCheckpoints(d) ? 15 * 60 : 13 * 60, Infinity];
}
function checkpointStartMinutes() {
  if (state.checkpoint === "13") return 0;
  if (state.checkpoint === "15") return 13 * 60;
  const d = new Date(state.targetDate + "T00:00:00");
  return isWeekendHolidayForCheckpoints(d) ? 15 * 60 : 13 * 60;
}
function priorCheckpointIds(cp, d) {
  if (cp === "13") return [];
  if (cp === "15") return ["13"];
  return isWeekendHolidayForCheckpoints(d) ? ["13", "15"] : ["13"];
}

function calculatedLaborStats() {
  const d = new Date(state.targetDate + "T00:00:00");
  const slots = slotsForDate(d);
  const cpMin = checkpointMinutes();
  let hours = 0, cost = 0;
  for (const s of slots) {
    const name = state.confirmed[s.id];
    if (!name) continue;
    const startMin = hmToMinutes(s.start);
    const endMin = hmToMinutes(s.end);
    const elapsedEnd = Math.min(cpMin, endMin);
    const minutes = Math.max(0, elapsedEnd - startMin);
    const h = minutes / 60;
    hours += h;
    cost += h * wageOf(name);
  }
  return { hours, cost };
}
function calculatedLaborCost() { return calculatedLaborStats().cost; }
function calculatedLaborHours() { return calculatedLaborStats().hours; }
function periodHoursBreakdown(fromMin, toMin) {
  const d = new Date(state.targetDate + "T00:00:00");
  const slots = slotsForDate(d);
  const byName = {};
  for (const s of slots) {
    const name = state.confirmed[s.id];
    if (!name) continue;
    const startMin = hmToMinutes(s.start);
    const endMin = hmToMinutes(s.end);
    const overlapStart = Math.max(startMin, fromMin);
    const overlapEnd = Math.min(endMin, toMin);
    const minutes = Math.max(0, overlapEnd - overlapStart);
    if (minutes <= 0) continue;
    const h = minutes / 60;
    byName[name] = (byName[name] || 0) + h;
  }
  return Object.entries(byName).map(([name, hours]) => ({ name, hours: round2(hours) })).sort((a, b) => b.hours - a.hours);
}
function staffHoursBreakdown() {
  // その日の開始からこの報告タイミングまでの累計
  return periodHoursBreakdown(0, checkpointMinutes());
}
function totalLaborHours() {
  return state.report.staffHours.reduce((sum, s) => sum + (Number(s.hours) || 0), 0);
}
function totalLaborCost() {
  return totalLaborHours() * state.avgWage;
}
function cumulativeStaffList() {
  const byName = {};
  for (const s of state.priorStaffHours || []) {
    const h = Number(s.hours) || 0;
    if (!s.name || !h) continue;
    byName[s.name] = (byName[s.name] || 0) + h;
  }
  for (const s of state.report.staffHours) {
    const h = Number(s.hours) || 0;
    if (!s.name || !h) continue;
    byName[s.name] = (byName[s.name] || 0) + h;
  }
  return Object.entries(byName).map(([name, hours]) => ({ name, hours })).sort((a, b) => b.hours - a.hours);
}
function cumulativeHoursTotal() { return cumulativeStaffList().reduce((sum, s) => sum + s.hours, 0); }
function cumulativeCostTotal() { return cumulativeHoursTotal() * state.avgWage; }



// 入力欄から指を離した直後に画面を作り直すと、同時に押した「保存」ボタンが差し替わって反応しなくなるため、少し遅らせて再描画する
let _rt = null;
function scheduleRender() { clearTimeout(_rt); _rt = setTimeout(render, 300); }
function updateReportField(field, value) { state.report[field] = value; state.reportDirty = true; state.touched = true; scheduleRender(); }
function addStaffHourRow() { state.touched = true;
  state.report.staffHours.push({ name: "", hours: "" });
  state.reportDirty = true;
  render();
}
function removeStaffHourRow(i) {  state.touched = true;state.report.staffHours.splice(i, 1); state.reportDirty = true; render(); }
function updateStaffHourRow(i, field, value) { state.touched = true;
  state.report.staffHours[i][field] = value;
  state.reportDirty = true;
  scheduleRender();
}
function orphanConfirmedNames() {
  const d = new Date(state.targetDate + "T00:00:00");
  const ids = new Set(slotsForDate(d).map((s) => s.id));
  return Object.keys(state.confirmed || {}).filter((id) => state.confirmed[id] && !ids.has(id)).map((id) => state.confirmed[id]);
}
function shiftWarningHtml() {
  let h = "";
  if (state.shiftNotice) h += `<div class="note" style="background:#e8f3ff;border:1px solid #9cc4ee;padding:8px;border-radius:6px;color:#1b4f8a">${esc(state.shiftNotice)}</div>`;
  const confirmedCount = Object.values(state.confirmed || {}).filter(Boolean).length;
  if (!confirmedCount) h += `<div class="note" style="background:#fff3e0;border:1px solid #f0b36b;padding:8px;border-radius:6px;color:#8a4b00">⚠ この日の確定シフトが登録されていません。シフト管理で確定されているか確認してください。</div>`;
  const orphan = orphanConfirmedNames();
  if (orphan.length) h += `<div class="note" style="background:#fdecec;border:1px solid #e59a9a;padding:8px;border-radius:6px;color:#9b1c1c">⚠ 確定シフトに入っているのに、時間枠が見つからず労働時間に含められていない人がいます：${esc(orphan.join("、"))}。シフト管理で枠の設定が変わった可能性があります。必要なら下で手動追加してください。</div>`;
  const fresh = staffHoursBreakdown();
  if (confirmedCount && !sameHours(fresh, state.report.staffHours)) {
    h += `<div class="note" style="background:#fff3e0;border:1px solid #f0b36b;padding:8px;border-radius:6px;color:#8a4b00">⚠ 下の一覧が、シフトから計算した時間と異なります。<br>シフト通り：${fresh.length ? fresh.map((r) => esc(r.name) + " " + fmtH(r.hours) + "h").join("、") : "なし"}<br>手動で変更した場合はそのままで構いません。シフト通りに戻すなら「🔄 シフトから取得し直す」を押してください。</div>`;

}
function refillStaffHoursFromShift() { state.touched = true;
  const fresh = staffHoursBreakdown();
  state.report.staffHours = fresh.map((s) => ({ ...s }));

async function saveAvgWage(value) {
  state.avgWage = Number(value) || 0;
  await apiSet("avgWageForReport", state.avgWage);
}
async function setStrict(key, value) {
  for (let i = 0; i < 3; i++) {
    try {
      const res = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "set", key, value: JSON.stringify(value) }) });
      const data = await res.json();
      if (data && data.ok) return true;
    } catch (e) { console.error("save attempt failed", i, e); }
    await new Promise((r) => setTimeout(r, 700 * (i + 1)));
  }
  return false;
}
function saveReport() {
  if (state.checkpoint === "close") {
    // クローズ報告: 最終の人件費・予算・売上から予算達成を記録(シフト提出サイト・従業員管理サイトで集計に使う)
    const sales = Number(state.report.sales) || 0;
    const budget = effectiveBudget();
    if (sales > 0 && budget > 0) {
      const u = unitInfo();
      state.report.final = {
        sales, budget, hours: round2(totalLaborHours()), labor: Math.round(totalLaborCost()),
        plannedHours: u.planned, budgetPlanned: budget, budgetActual: Math.round(u.hours * u.budgetUnit), budgetUnit: Math.round(u.budgetUnit), salesUnit: Math.round(u.salesUnit),
        achievedByAmount: sales >= budget,
        achieved: u.ok, // 実際の労働時間に対する予算(=予算単価×実労働時間)を、売上が上回ったか(売上単価≧予算単価と同じ)
      };
    } else {
      delete state.report.final;
    }
  }
  // 先に画面を「保存済み」にして、すぐコピーできるようにする。送信は裏で行い、失敗したら元に戻して知らせる。
  const date = state.targetDate, cp = state.checkpoint;
  const key = `teijiReport:${date}:${cp}`;
  const payload = JSON.parse(JSON.stringify(state.report));
  state.dayReports = { ...(state.dayReports || {}), [cp]: payload };
  const c = readCache(date);
  if (c) { c.values = c.values || {}; c.values[key] = payload; writeCache(date, c); }
  state.reportDirty = false;
  state.touched = false;
  render();
  flash("保存しました（コピーできます）");
  setStrict(key, payload).then((ok) => {
    if (ok) return;
    if (state.targetDate === date && state.checkpoint === cp) { state.reportDirty = true; render(); }
    flash("⚠ 保存に失敗しました。通信を確認してもう一度「保存」を押してください", true);
  });
}

function generateReportText() {
  const cpInfo = CHECKPOINTS.find((c) => c.id === state.checkpoint);
  const title = state.checkpoint === "close" ? "クローズ定時報告致します。" : `${cpInfo.label}定時報告致します。`;
  const sales = Number(state.report.sales) || 0;
  const labor = cumulativeCostTotal();
  const hours = cumulativeHoursTotal();
  const rate = sales > 0 ? (labor / sales) * 100 : 0;
  const budget = effectiveBudget();
  const achieveRate = budget > 0 ? (sales / budget) * 100 : 0;
  const staffList = cumulativeStaffList();
  const lines = [
    title,
    `売上（税抜）：${fmtNum(sales)}`,
    `予算：${fmtNum(budget)}（${fmtH(budgetCalc().hours)}h×${fmtNum(Math.round(budgetCalc().rate))}円）`,
    `予算達成率：${achieveRate.toFixed(1)}%`,
    `人件費：${fmtNum(labor)}`,
    `労働時間：${fmtH(hours)}時間`,
  ];
  if (staffList.length) {
    lines.push(`【出勤者】`);
    for (const s of staffList) lines.push(`${s.name}：${fmtH(s.hours)}時間`);
  }
  lines.push(
    `人件費率：${rate.toFixed(1)}%`,
    `事前断り無し20分オーバー　${state.report.overCount || 0}件`,
    `累計呼び込み回数(77db以上)　${state.report.callOutCount || 0}回`,
    `欠品商品`
  );
  if (state.report.missingItems && state.report.missingItems.trim()) lines.push(state.report.missingItems.trim());
  return lines.join("\n");
}

          <div class="summary-item"><div class="label">労働時間</div><div class="value">${fmtH(hoursTotal)}h</div></div>
        </div>
        <p class="note">上の「報告内容の入力」欄にある「誰が何時間入っているか」一覧の合計（時間 × 平均時給）です。開店からこの時点までの累計で、LINE報告文にもこの数字が使われます。</p>
        <div class="field-row" style="margin-top:14px">
          <div>
            <label class="field-label">人件費計算用 平均時給（円）</label>
            <input type="number" value="${state.avgWage}" onchange="saveAvgWage(this.value)" />
          </div>
        </div>
        <p class="note">この報告での人件費はすべて、この平均時給で概算計算します（スタッフごとの実際の時給は使いません）。</p>
      </div>
    </div>
  `;
}

window.changeDate = changeDate;
window.changeCheckpoint = changeCheckpoint;
window.updateReportField = updateReportField;
window.addStaffHourRow = addStaffHourRow;
window.removeStaffHourRow = removeStaffHourRow;
window.updateStaffHourRow = updateStaffHourRow;
window.refillStaffHoursFromShift = refillStaffHoursFromShift;
window.saveAvgWage = saveAvgWage;
window.saveReport = saveReport;
window.copyReportText = copyReportText;
window.saveMonthBudget = saveMonthBudget;

(async function boot() {
  await loadDayData();
})();
</script>
</body>
</html>
