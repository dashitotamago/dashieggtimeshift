<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>打刻</title>
<style>
  :root {
    --bg: #F6F3EC; --ink: #22282F; --border: #DED7C6;
    --green: #2F6F4E; --orange: #B5541E; --orange-bg: #FBE9D6;
    --rose: #C1666B; --muted: #7A756A; --muted2: #9A968C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  .disp { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; }
  header { background: var(--ink); padding: 20px; text-align: center; }
  header h1 { margin: 0; color: #F6F3EC; font-size: 22px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 16px; }
  select {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 14px; font-size: 18px; background: #fff;
  }
  .clock-btn {
    width: 100%; padding: 22px; margin-top: 12px; border-radius: 8px; border: none;
    font-size: 18px; font-weight: 700; color: #fff; cursor: pointer;
  }
  .btn-in { background: var(--green); }
  .btn-out { background: var(--rose); }
  .btn-break-start { background: var(--orange); }
  .btn-break-end { background: #8A6D3B; }
  .clock-btn:disabled { opacity: .4; cursor: not-allowed; }
  video, canvas { width: 100%; border-radius: 8px; background: #000; }
  .cam-actions { display: flex; gap: 10px; margin-top: 12px; }
  .cam-actions button { flex: 1; padding: 14px; border-radius: 6px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn-capture { background: var(--green); color: #fff; }
  .btn-retake { background: #fff; border: 1px solid var(--border) !important; color: var(--muted); }
  .btn-cancel { background: #fff; border: 1px solid var(--border) !important; color: var(--rose); }
  .center-msg { text-align: center; padding: 80px 24px; color: var(--muted); font-size: 16px; }
  .result { text-align: center; padding: 40px 20px; }
  .result .big { font-size: 44px; }
  .flash { text-align: center; font-size: 13px; color: var(--rose); margin-top: 8px; }
  .now-clock { text-align: center; font-size: 14px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzOSPmWXfZTvMLiOa8bucfhU3UgJdUqxucc7NWDCq2WMRHsjHqPFRDm34F8S3og8i_b/exec",
  IPAD_ONLY: true,
  ADMIN_PASSWORD: "0310",
};

const PUNCH_TYPES = [
  { id: "in", label: "出勤", cls: "btn-in", icon: "🟢" },
  { id: "out", label: "退勤", cls: "btn-out", icon: "🔴" },
];

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function timeLabel(d) { return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

function isIpad() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua)) return true;
  // iPadOS 13+ reports as Mac but has touch support
  if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) return true;
  return false;
}

async function apiGet(key) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data || data.value == null || data.value === "") return null;
    return JSON.parse(data.value);
  } catch (e) { console.error("apiGet failed", key, e); return null; }
}
async function apiSet(key, value) {
  try {
    await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "set", key, value: JSON.stringify(value) }),
    });
    return true;
  } catch (e) { console.error("apiSet failed", key, e); return false; }
}
async function apiSavePhoto(base64, filename) {
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "savePhoto", base64, filename }),
    });
    const data = await res.json();
    return data; // { url, fileId } on success, or { error: "..." } on failure
  } catch (e) { console.error("apiSavePhoto failed", e); return { error: String(e) }; }
}
async function apiAction(payload) {
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    return await res.json();
  } catch (e) { console.error("apiAction failed", payload, e); return { error: String(e) }; }
}

const state = {
  staffDirectory: [],
  selectedName: "",
  selectedType: null,
  history: [],
  historyLoading: false,
  stream: null,
  loading: true,
  saving: false,
  flash: "",
  resultMsg: null,
  deviceAuthorized: false,
  deviceCheckDone: false,
  showRegister: false,
  registerFlash: "",
  adminPasswordValue: null,
};

function flash(msg) {
  state.flash = msg;
  render();
  setTimeout(() => { state.flash = ""; render(); }, 2200);
}

function normalizeStaffDirectory(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map((item) => (typeof item === "string" ? { name: item } : { name: item.name }));
}

function getLocalDeviceToken() {
  return localStorage.getItem("clockDeviceToken");
}
function genToken() {
  return "dev_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

async function checkDeviceAuthorized() {
  const local = getLocalDeviceToken();
  const authorized = await apiGet("authorizedDeviceToken");
  state.deviceAuthorized = !!local && !!authorized && local === authorized;
  state.deviceCheckDone = true;
  render();
}

async function registerThisDevice() {
  const input = document.getElementById("registerPasswordInput");
  const value = input ? input.value : "";
  const expected = state.adminPasswordValue != null ? state.adminPasswordValue : CONFIG.ADMIN_PASSWORD;
  if (value !== expected) {
    state.registerFlash = "パスワードが違います";
    render();
    return;
  }
  const token = genToken();
  localStorage.setItem("clockDeviceToken", token);
  await apiSet("authorizedDeviceToken", token);
  state.deviceAuthorized = true;
  state.showRegister = false;
  state.registerFlash = "";
  render();
  loadStaff();
}

async function loadStaff() {
  state.loading = true; render();
  const list = await apiGet("staffList");
  state.staffDirectory = normalizeStaffDirectory(list);
  state.loading = false;
  render();
}

function selectType(typeId) {
  if (!state.selectedName) { flash("従業員名を選択してください"); return; }
  if (typeId === "out") {
    if (!confirm(`${state.selectedName}さん、退勤を打刻します。よろしいですか？`)) return;
    state.selectedType = "out";
    commitPunch(null); // 退勤は写真なし
    return;
  }
  state.selectedType = typeId;
  render();
  startCamera();
}

async function startCamera() {
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    const video = document.getElementById("camVideo");
    if (video) video.srcObject = state.stream;
  } catch (e) {
    flash("カメラを起動できませんでした");
    state.selectedType = null;
    render();
  }
}
function stopCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach((t) => t.stop());
    state.stream = null;
  }
}
function cancelCamera() {
  stopCamera();
  state.selectedType = null;
  render();
}

async function capturePhoto() {
  const video = document.getElementById("camVideo");
  if (!video) return;
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  const base64 = canvas.toDataURL("image/jpeg", 0.8);
  stopCamera();
  commitPunch(base64);
}

async function commitPunch(base64) {
  state.saving = true; render();
  const now = new Date();
  const dKey = dateKey(now);
  const name = state.selectedName;
  const type = state.selectedType;
  const filename = `${name}_${dKey}_${type}_${now.getTime()}`;
  const punchKey = `punch:${dKey}:${name}`;

  // 1) 写真保存(失敗しても打刻自体は記録する)
  const needPhoto = base64 != null;
  const photoResult = needPhoto ? await apiSavePhoto(base64, filename) : null;
  const photoOk = !needPhoto || !!(photoResult && photoResult.url);
  const record = { type, time: now.toISOString(), photoUrl: (needPhoto && photoOk) ? photoResult.url : "" };

  // 2) 打刻記録(再試行付き・サーバー確認つき)。失敗したら端末に保留して自動再送
  const saved = await savePunchReliably(punchKey, record);
  if (!saved) addPending({ key: punchKey, record });

  // 3) LINE送信は打刻が確定してから
  let lineResult = null;
  if (saved && type === "in" && needPhoto && photoOk && photoResult.fileId) {
    lineResult = await apiAction({ action: "notifyLineClockIn", fileId: photoResult.fileId, name, time: now.toISOString() });
  }

  state.saving = false;
  const typeInfo = PUNCH_TYPES.find((t) => t.id === type);
  let long = false;
  if (saved) {
    state.resultMsg = `${name}さん ${typeInfo.label} 完了（${timeLabel(now)}）`;
  } else {
    state.resultMsg = `⚠ 通信が不安定で打刻の確定を確認できませんでした\n記録は端末に保留しました（${timeLabel(now)}）。自動で再送します。\n再度打刻せず、少し待ってから管理者に確認してください。`;
    long = true;
  }
  if (!photoOk) { state.resultMsg += `\n⚠ 写真の保存に失敗（打刻は記録済み）`; long = true; }
  if (lineResult && !lineResult.sent) {
    state.resultMsg += `\n⚠ LINE送信失敗: ${lineResult.reason || (lineResult.status + " " + lineResult.body)}`;
    long = true;
  }
  state.selectedType = null;
  render();
  loadHistory();
  setTimeout(() => { state.resultMsg = null; render(); }, long ? 10000 : 3000);
}

// ---- 打刻の確実な保存 ----
const PENDING_KEY = "clockPendingPunches";
function loadPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch (e) { return []; } }
function storePending(list) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch (e) {} }
function addPending(item) { const l = loadPending(); l.push(item); storePending(l); }

async function postJson(payload, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 25000);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      signal: ctrl.signal,
    });
    return await res.json();
  } finally { clearTimeout(t); }
}
async function readPunchList(key) {
  // 失敗(null)と「データ無し」([])を区別する
  const res = await fetch(`${CONFIG.API_URL}?action=get&key=${encodeURIComponent(key)}`);
  const data = await res.json();
  if (!data || data.error) throw new Error((data && data.error) || "read failed");
  if (data.value == null || data.value === "") return [];
  return JSON.parse(data.value);
}
function hasRecord(list, rec) { return Array.isArray(list) && list.some((r) => r.type === rec.type && r.time === rec.time); }

async function savePunchReliably(key, record) {
  for (let i = 0; i < 4; i++) {
    try {
      const r = await postJson({ action: "appendPunch", key, record });
      if (r && r.ok) return true;
      if (r && r.error && /unknown action/.test(r.error)) {
        // Code.gs が未更新の場合の代替(読み込み成功時のみ追記)
        const list = await readPunchList(key);
        if (!hasRecord(list, record)) {
          list.push(record);
          await postJson({ action: "set", key, value: JSON.stringify(list) });
        }
        const verify = await readPunchList(key);
        if (hasRecord(verify, record)) return true;
      }
    } catch (e) { console.error("savePunch attempt failed", i, e); }
    await new Promise((r) => setTimeout(r, 800 * (i + 1)));
  }
  // 最後に、実は保存されていたか確認
  try { if (hasRecord(await readPunchList(key), record)) return true; } catch (e) {}
  return false;
}

let flushing = false;
async function flushPending() {
  if (flushing) return;
  const list = loadPending();
  if (!list.length) return;
  flushing = true;
  const rest = [];
  for (const item of list) {
    const ok = await savePunchReliably(item.key, item.record);
    if (!ok) rest.push(item);
  }
  storePending(rest);
  flushing = false;
}
setInterval(flushPending, 30000);

async function loadHistory() {
  const name = state.selectedName;
  if (!name) { state.history = []; return; }
  state.historyLoading = true; render();
  const days = [];
  for (let i = 0; i < 14; i++) { const d = new Date(); d.setDate(d.getDate() - i); days.push(dateKey(d)); }
  const results = await Promise.all(days.map((k) => apiGet(`punch:${k}:${name}`)));
  if (state.selectedName !== name) return;
  const all = [];
  results.forEach((list) => { if (Array.isArray(list)) list.forEach((r) => all.push(r)); });
  all.sort((a, b) => new Date(b.time) - new Date(a.time));
  state.history = all.slice(0, 3);
  state.historyLoading = false;
  render();
}

function render() {
  const root = document.getElementById("root");

  if (CONFIG.IPAD_ONLY && !isIpad()) {
    root.innerHTML = `<div class="center-msg">
      <div style="font-size:40px">📵</div>
      <p style="font-weight:700;margin-top:12px">このアプリは店舗のiPadでのみご利用いただけます</p>
    </div>`;
    return;
  }

  if (!CONFIG.API_URL) {
    root.innerHTML = `<div class="center-msg">API_URLが設定されていません</div>`;
    return;
  }

  if (!state.deviceCheckDone) {
    root.innerHTML = `<div class="center-msg">確認中…</div>`;
    return;
  }

  if (!state.deviceAuthorized) {
    if (state.showRegister) {
      root.innerHTML = `
        <header><h1 class="disp">🕐 打刻</h1></header>
        <div class="wrap">
          <div class="card">
            <p style="text-align:center;font-weight:700;margin-top:0">このiPadを打刻用として登録します</p>
            <p style="font-size:13px;color:var(--muted);text-align:center">登録すると、これまで登録されていた別の端末は使えなくなります。</p>
            <input type="password" id="registerPasswordInput" placeholder="管理者パスワード" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;font-size:16px;margin-top:8px" />
            <div class="cam-actions">
              <button class="btn-cancel" onclick="state.showRegister=false; render();">キャンセル</button>
              <button class="btn-capture" onclick="registerThisDevice()">この端末を登録する</button>
            </div>
            ${state.registerFlash ? `<p class="flash">${esc(state.registerFlash)}</p>` : ""}
          </div>
        </div>
      `;
      return;
    }
    root.innerHTML = `<div class="center-msg">
      <div style="font-size:40px">🔒</div>
      <p style="font-weight:700;margin-top:12px">このiPadは打刻用として登録されていません</p>
      <p style="font-size:13px;margin-top:8px">店舗の指定端末以外では打刻できません。</p>
      <button class="clock-btn btn-in" style="max-width:280px;margin:20px auto 0" onclick="state.showRegister=true; render();">この端末を登録する（管理者用）</button>
    </div>`;
    return;
  }

  let body;

  if (state.selectedType === "out") {
    body = `<div class="center-msg">${esc(state.selectedName)}さん 退勤を記録中…</div>`;
  } else if (state.selectedType) {
    body = `
      <div class="card">
        <p style="text-align:center;font-weight:700;margin-top:0">
          ${state.selectedName}さん — ${PUNCH_TYPES.find((t) => t.id === state.selectedType).label}
        </p>
        <video id="camVideo" autoplay playsinline muted></video>
        <div class="cam-actions">
          <button class="btn-cancel" onclick="cancelCamera()">キャンセル</button>
          <button class="btn-capture" onclick="capturePhoto()" ${state.saving ? "disabled" : ""}>${state.saving ? "保存中…" : "📸 撮影して打刻"}</button>
        </div>
      </div>
    `;
  } else if (state.resultMsg) {
    const hasWarning = state.resultMsg.indexOf("⚠") !== -1;
    body = `<div class="result">
      <div class="big">${hasWarning ? "⚠️" : "✅"}</div>
      <p style="font-size:16px;font-weight:700;margin-top:12px;white-space:pre-wrap">${esc(state.resultMsg)}</p>
    </div>`;
  } else if (state.loading) {
    body = `<div class="center-msg">読み込み中…</div>`;
  } else {
    let options = `<option value="">従業員を選択してください</option>`;
    for (const s of state.staffDirectory) {
      options += `<option value="${esc(s.name)}" ${state.selectedName === s.name ? "selected" : ""}>${esc(s.name)}</option>`;
    }
    body = `
      <div class="card">
        <select id="staffSelect" onchange="onSelectStaff(this.value)">${options}</select>
      </div>
      <div class="card">
        ${PUNCH_TYPES.map((t) => `<button class="clock-btn ${t.cls}" onclick="selectType('${t.id}')" ${!state.selectedName ? "disabled" : ""}>${t.icon} ${t.label}</button>`).join("")}
      </div>
      ${state.flash ? `<div class="flash">${esc(state.flash)}</div>` : ""}
      ${state.selectedName ? renderHistory() : ""}
    `;
  }

  root.innerHTML = `
    <header><h1 class="disp">🕐 打刻</h1></header>
    <div class="wrap">${body}</div>
  `;

  if (state.selectedType) {
    // camera element just got created; stream will attach once startCamera resolves
    const video = document.getElementById("camVideo");
    if (video && state.stream) video.srcObject = state.stream;
  }
}

function renderHistory() {
  let inner;
  if (state.historyLoading) inner = `<p style="color:var(--muted,#888);margin:0">読み込み中…</p>`;
  else if (!state.history.length) inner = `<p style="color:var(--muted,#888);margin:0">直近の打刻はありません</p>`;
  else inner = state.history.map((r) => {
    const d = new Date(r.time);
    const label = r.type === "in" ? "🟢 出勤" : "🔴 退勤";
    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.2)"><span>${label}</span><span>${d.getMonth() + 1}/${d.getDate()} ${timeLabel(d)}</span></div>`;
  }).join("");
  return `<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:6px">${esc(state.selectedName)}さんの直近の打刻（3回分）</div>${inner}</div>`;
}

function onSelectStaff(name) {
  state.selectedName = name;
  state.history = [];
  render();
  loadHistory();
}

window.selectType = selectType;
window.cancelCamera = cancelCamera;
window.capturePhoto = capturePhoto;
window.onSelectStaff = onSelectStaff;
window.registerThisDevice = registerThisDevice;
window.state = state;
window.render = render;

(async function boot() {
  render();
  const storedPw = await apiGet("adminPassword");
  state.adminPasswordValue = storedPw != null ? storedPw : null;
  await checkDeviceAuthorized();
  if (state.deviceAuthorized) loadStaff();
  flushPending();
})();
</script>
</body>
</html>
